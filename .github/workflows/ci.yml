name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      AUTH_TOKEN_SECRET: 'test-secret-token'
      REFRESH_TOKEN_SECRET: 'test-secret-refresh'
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Type check
        run: npm run check-types

      - name: Run Unit Tests
        run: npm run test

      - name: Run E2E Auth Tests
        run: npm run test:e2e
